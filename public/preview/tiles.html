<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff tiles preview</title>
<style>
body{margin:0;background:#e9eaec;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#242628}
.phone{max-width:400px;margin:24px auto;background:linear-gradient(180deg,#E8EFF7,#F1F5F9);padding:20px;border-radius:20px}
h2{font-size:13px;color:#666A6E;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.home-tile{position:relative;height:68px;box-sizing:border-box;border:1px solid;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;padding:6px 2px 0;color:inherit}
.home-tile span{font-size:11.5px;font-weight:700;line-height:1.15}
.home-tile img{display:block;height:42px;max-width:100%;object-fit:contain;object-position:bottom}
.badge{position:absolute;right:4px;top:4px;background:#E53935;color:#fff;font-size:10px;font-weight:600;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center}
button{padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff}
/* Home quick tiles (same as the parent app): a soft blue card that fades in, then each picture glides in its own way
   and settles on the card's bottom edge. One long ease-out per picture, no overshoot. */
.home-tile{border-color:#E1E7F8;background:linear-gradient(160deg,#F4F7FF 0%,#DCE5FF 100%);animation:home-tile-in .35s ease-out both}
.home-tile img{animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,1,.3,1);will-change:transform}
.home-art-slide{animation-name:home-art-slide;animation-duration:1.3s}
.home-art-rise{animation-name:home-art-rise;animation-duration:1s}
.home-art-tilt{transform-origin:50% 100%;animation-name:home-art-tilt;animation-duration:1.1s}
.home-art-grow{transform-origin:50% 100%;animation-name:home-art-grow;animation-duration:1.1s}
@keyframes home-tile-in{from{opacity:0}to{opacity:1}}
/* Slides in from the left and slows to a gentle stop (the parent app's bus). */
@keyframes home-art-slide{from{transform:translateX(-160%)}to{transform:none}}
/* Rises up out of the card's bottom edge. */
@keyframes home-art-rise{from{transform:translateY(105%)}to{transform:none}}
/* Rises while turning upright. */
@keyframes home-art-tilt{from{transform:translateY(105%) rotate(-14deg)}to{transform:none}}
/* Rises while growing to full size. */
@keyframes home-art-grow{from{transform:translateY(60%) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.home-tile,.home-tile img{animation:none}}
</style></head><body><div class="phone" id="p">
<h2>Teacher</h2><div class="grid"><a class="home-tile" style="animation-delay:0ms"><span>Attendance</span><img class="home-art-grow" style="animation-delay:150ms" src="/img/tiles/attendance.png"></a><a class="home-tile" style="animation-delay:80ms"><span>Homework</span><img class="home-art-rise" style="animation-delay:230ms" src="/img/tiles/homework.png"></a><a class="home-tile" style="animation-delay:160ms"><span>Students</span><img class="home-art-slide" style="animation-delay:310ms" src="/img/tiles/students.png"></a><a class="home-tile" style="animation-delay:240ms"><span>Marks</span><img class="home-art-tilt" style="animation-delay:390ms" src="/img/tiles/marks.png"></a></div>
<h2>Baaki staff</h2><div class="grid"><a class="home-tile" style="animation-delay:0ms"><span>Attendance</span><img class="home-art-rise" style="animation-delay:150ms" src="/img/tiles/my-attendance.png"></a><a class="home-tile" style="animation-delay:80ms"><span>Leave</span><img class="home-art-grow" style="animation-delay:230ms" src="/img/tiles/leave.png"></a><a class="home-tile" style="animation-delay:160ms"><span>Salary</span><img class="home-art-tilt" style="animation-delay:310ms" src="/img/tiles/salary.png"></a><a class="home-tile" style="animation-delay:240ms"><span>Notice</span><b class="badge">2</b><img class="home-art-slide" style="animation-delay:390ms" src="/img/tiles/notice.png"></a></div>
<button onclick="var p=document.getElementById('p');p.outerHTML=p.outerHTML">Animation dobara chalao</button></div></body></html>
